<head>

<style>
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --field:#F4F6F9; --field-3:#E9EDF3; --ink:#002A5A; --muted:#7D879C; --faint:#B5BDCB;
  --line:#E4E8EF; --line-strong:#CBD2DE;
  --accent:#002A5A; --accent-ink:#FFFFFF; --accent-soft:rgba(0,42,90,.07); --accent-line:#CBD2DE; --accent-text:#002A5A;
  --navy:#002A5A; --on-navy:#FFFFFF; --on-navy-dim:#9AA8CC; --yellow:#FFAD00; --red-on-navy:#FF7A7A; --ok-on-navy:#7BE3A8;
  --ok:#1F9D57; --ok-bg:#E7F6EE; --ok-line:#A6DDBF; --ok-text:#17804A;
  --err:#D93636; --err-bg:#FDECEC; --err-line:#F3B4B4; --err-text:#B42323;
  --warn:#C98300; --warn-bg:#FFF4D9; --warn-line:#F2D58F;
  --shadow:0 1px 2px rgba(0,42,90,.06),0 4px 14px rgba(0,42,90,.05);
  --display:"Manrope","Barlow",system-ui,sans-serif;
  --body:"Manrope","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px; --r-sm:6px; --ctl:44px; --btn-pri:#002A5A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1124; --card:#121B33; --field:#18233F; --field-3:#202C4A; --ink:#EEF2FA; --muted:#8792AD; --faint:#56627D;
  --line:#202C4A; --line-strong:#2E3C60;
  --accent:#8FA6FF; --accent-ink:#0A1124; --accent-soft:rgba(143,166,255,.12); --accent-line:#2E3C60; --accent-text:#AFC0FF;
  --navy:#16245A; --yellow:#FFB81F; --red-on-navy:#FF8A8A;
  --ok:#40C97F; --ok-bg:rgba(64,201,127,.12); --ok-line:#22543A; --ok-text:#7FDCAA;
  --err:#FF6464; --err-bg:rgba(255,100,100,.14); --err-line:#5E2723; --err-text:#FF9A9A;
  --warn:#FFB81F; --warn-bg:rgba(255,184,31,.14); --warn-line:#5A4618;
  --shadow:none; --btn-pri:#22357A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1124; --card:#121B33; --field:#18233F; --field-3:#202C4A; --ink:#EEF2FA; --muted:#8792AD; --faint:#56627D;
  --line:#202C4A; --line-strong:#2E3C60;
  --accent:#8FA6FF; --accent-ink:#0A1124; --accent-soft:rgba(143,166,255,.12); --accent-line:#2E3C60; --accent-text:#AFC0FF;
  --navy:#16245A; --yellow:#FFB81F; --red-on-navy:#FF8A8A;
  --ok:#40C97F; --ok-bg:rgba(64,201,127,.12); --ok-line:#22543A; --ok-text:#7FDCAA;
  --err:#FF6464; --err-bg:rgba(255,100,100,.14); --err-line:#5E2723; --err-text:#FF9A9A;
  --warn:#FFB81F; --warn-bg:rgba(255,184,31,.14); --warn-line:#5A4618;
  --shadow:none; --btn-pri:#22357A; color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink);text-decoration:none;margin-left:-6px}
.back svg{width:22px;height:22px}
.brand-logo{display:block;height:32px;width:auto;flex:none;color:var(--ink)}
.brand-logo .p-marine{fill:currentColor}.brand-logo .p-jaune,.brand-logo .j-jaune{fill:var(--yellow,#FFAD00)}.brand-logo .j-trou{fill:var(--card,#fff)}
.brand{font:800 21px var(--body);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:40px;padding:0 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);font:700 14px var(--body);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--btn-pri);border-color:var(--btn-pri);color:#fff}
.btn.danger{color:var(--err-text)}
.band{background:var(--navy);color:var(--on-navy)}
.band-in{max-width:760px;margin:0 auto;padding:13px 16px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.band .k{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--on-navy-dim)}
.band .bv{font:800 28px/1.1 var(--body);margin-top:2px}
.band .bv small{font:600 13.5px var(--body);color:var(--on-navy-dim);margin-left:6px}
.band .csv{background:none;border:0;color:var(--on-navy);font:800 14px var(--body);display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:6px 0}
.band .csv svg{width:17px;height:17px}
main{max-width:760px;margin:0 auto;padding:14px 14px 48px}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-strong);border-radius:10px;height:46px;padding:0 12px}
.srch svg{width:18px;height:18px;color:var(--muted);flex:none}
.srch input{flex:1;border:0;background:none;outline:none;font:500 15.5px var(--body);min-width:0;height:100%}
.count{font:600 12.5px var(--body);color:var(--muted);margin:8px 2px 0}
.dayh{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line-strong);border-radius:1px}
.it{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.it::before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--bg)}
.it.bad::before{background:var(--err)}
.it.warn::before{background:var(--warn)}
.it:hover{border-color:var(--line-strong)}
.it.sel{border-color:var(--ink)}
.it .h{display:flex;justify-content:space-between;gap:10px;font:800 15px var(--body)}
.it .h span{font:700 12.5px var(--body);color:var(--muted);flex:none}
.it .s{font:600 12.5px var(--body);color:var(--muted);margin-top:2px}
.vs{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.v{font:800 10.5px var(--body);letter-spacing:.04em;border-radius:4px;padding:3px 6px;background:var(--ok-bg);color:var(--ok-text)}
.v.bad{background:var(--err-bg);color:var(--err-text)}
.v.none{background:var(--field);color:var(--faint)}
.keep{font:600 12px/1.4 var(--body);color:var(--muted);text-align:center;margin:22px 10px 0}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font:600 14px var(--body)}
/* Connexion */
.login{max-width:420px;margin:40px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;box-shadow:var(--shadow)}
.login .k{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.login h2{font:800 22px var(--body);margin:6px 0 16px}
.login form{display:grid;gap:10px}
.inp{height:46px;border:1px solid var(--line-strong);border-radius:8px;background:var(--field);padding:0 12px;font:600 16px var(--body);min-width:0}
.inp:focus{outline:none;border-color:var(--ink)}
.login .btn{height:48px;justify-content:center;font-size:15px}
.msg{font:600 14px var(--body);color:var(--err-text)}
/* Détail : panneau */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(6,14,36,.5)}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:sin .22s ease-out}
@keyframes sin{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.sh-top{position:sticky;top:0;background:var(--navy);color:var(--on-navy);padding:12px 16px 14px;display:flex;gap:10px;align-items:flex-start}
.sh-top .k{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--on-navy-dim)}
.sh-top .t{font:800 21px var(--body);margin-top:2px}
.sh-top .s{font:600 13px var(--body);color:var(--on-navy-dim);margin-top:2px}
.sh-x{margin-left:auto;background:none;border:0;color:var(--on-navy);font:500 26px/1 var(--body);cursor:pointer;padding:0 2px}
.sh-in{padding:14px 16px 30px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:10px}
.blk .bt{display:flex;justify-content:space-between;align-items:center;font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 div{background:var(--field);border-radius:8px;padding:8px 10px}
.g2 small{display:block;font:600 11.5px var(--body);color:var(--muted)}
.g2 b{font:800 16px var(--body)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font:600 13.5px var(--body)}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted);font-weight:600}
.row span:last-child{text-align:right}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--body);padding:6px 10px;border-radius:6px}
.badge.ok{background:var(--ok-bg);color:var(--ok-text)}.badge.bad{background:var(--err-bg);color:var(--err-text)}
.hash{font:500 11px var(--mono,ui-monospace),Menlo,Consolas,monospace;color:var(--muted);word-break:break-all;margin-top:8px}
.acts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.acts .btn{height:46px;justify-content:center}
</style>
</head>

    const add = s => { objs.push(s); return objs.length; };
    const catalog = add(null), pagesId = add(null);
    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2i = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const f3 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
    const kids = [];
    this.pages.forEach(ops => {
      const content = ops.join('\n');
      const cid = add('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
      kids.push(add('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' + f2(this.W) + ' ' + f2(this.H) +
        '] /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2i + ' 0 R /F3 ' + f3 + ' 0 R >> >> /Contents ' + cid + ' 0 R >>'));
    });
    objs[catalog - 1] = '<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>';
    objs[pagesId - 1] = '<< /Type /Pages /Kids [' + kids.map(k => k + ' 0 R').join(' ') + '] /Count ' + kids.length + ' >>';
    const info = add('<< /Title (' + esc(toWin(meta && meta.title || 'Fiche')) + ') /Producer (Performances ACBT) /Creator (Performances ACBT) >>');
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offs = [];
    objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
    const xref = out.length;
    out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' +
      offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalog + ' 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
    return bytes;
  };

  /* ── Mise en page de la fiche (style épuré, proche de l'application) ── */
  const C = {
    ink: [0.08, 0.13, 0.17], muted: [0.36, 0.42, 0.47], faint: [0.55, 0.6, 0.65], line: [0.85, 0.87, 0.9], soft: [0.965, 0.972, 0.98],
    accent: [0.12, 0.44, 0.82], accentSoft: [0.92, 0.95, 0.99],
    ok: [0.11, 0.54, 0.31], okText: [0.11, 0.42, 0.24], okBg: [0.91, 0.96, 0.93],
    bad: [0.70, 0.15, 0.12], badText: [0.60, 0.12, 0.09], badBg: [0.99, 0.93, 0.92],
    amber: [0.54, 0.32, 0.0], amberBg: [1, 0.965, 0.9], white: [1, 1, 1]
  };
  function fmtLocal(iso) {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  // Rectangle à coins arrondis
  PDF.prototype.rrect = function (x, y, w, h, r, o) {
    o = o || {};
    const k = 0.5523 * r, H = this.H, Y = y;
    const P = (px, py) => f2(px) + ' ' + f2(H - py);
    let s = 'q ';
    if (o.fill) s += this.color(o.fill) + ' ';
    if (o.stroke) s += this.color(o.stroke, true) + ' ' + f2(o.lw || 0.7) + ' w ';
    s += P(x + r, Y) + ' m ' + P(x + w - r, Y) + ' l ' +
      P(x + w - r + k, Y) + ' ' + P(x + w, Y + r - k) + ' ' + P(x + w, Y + r) + ' c ' +
      P(x + w, Y + h - r) + ' l ' +
      P(x + w, Y + h - r + k) + ' ' + P(x + w - r + k, Y + h) + ' ' + P(x + w - r, Y + h) + ' c ' +
      P(x + r, Y + h) + ' l ' +
      P(x + r - k, Y + h) + ' ' + P(x, Y + h - r + k) + ' ' + P(x, Y + h - r) + ' c ' +
      P(x, Y + r) + ' l ' +
      P(x, Y + r - k) + ' ' + P(x + r - k, Y) + ' ' + P(x + r, Y) + ' c h ' +
      (o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S') + ' Q';
    this.ops.push(s);
  };
  // Pastille de verdict ; renvoie sa largeur
  function pill(pdf, xRight, yTop, txt, kind) {
    const t = txt.toUpperCase(), size = 7.5;
    const w = textWidth(t, 'HB', size) + 14;
    const fill = kind === 'ok' ? C.okBg : kind === 'bad' ? C.badBg : C.soft;
    const col = kind === 'ok' ? C.okText : kind === 'bad' ? C.badText : C.muted;
    pdf.rrect(xRight - w, yTop, w, 15, 7.5, { fill });
    pdf.text(xRight - w / 2, yTop + 10.3, t, { font: 'HB', size, color: col, align: 'center' });
    return w;
  }

  function renderFichePDF(d) {
    const pdf = new PDF();
    const M = 40, W = pdf.W - 2 * M, BOTTOM = pdf.H - 64;
    let y = 0;
    const ensure = need => { if (y + need > BOTTOM) { footer(); pdf.addPage(); y = M; } };
    const label = (x, yy, t, o) => pdf.text(x, yy, t.toUpperCase(), Object.assign({ font: 'HB', size: 6.6, color: C.muted }, o || {}));

    // ── En-tête blanc, filet bleu
    pdf.text(M, 44, 'Fiche de préparation du vol', { font: 'HB', size: 17 });
    pdf.text(M, 60, 'Aéroclub de Beauvais-Tillé · Performances', { size: 9, color: C.muted });
    pdf.text(pdf.W - M, 44, (d.aircraft && d.aircraft.immat) || '—', { font: 'HB', size: 20, color: C.accent, align: 'right' });
    const club = d.aircraft && d.aircraft.club;
    if (club) pdf.text(pdf.W - M, 58, club, { font: 'HB', size: 8.5, color: C.ink, align: 'right' });
    pdf.text(pdf.W - M, club ? 69 : 60, 'Fiche n° ' + d.id, { size: club ? 7.5 : 8.5, color: C.muted, align: 'right' });
    pdf.rect(M, 76, W, 2, { fill: C.accent });
    y = 94;

    // ── Bandeau d'informations (sans cadre)
    const info = [
      ['Pilote', d.pilot || '—'],
      ['Date et heure (locale)', fmtLocal(d.created)],
      ['Type', (d.aircraft && (d.aircraft.type || d.aircraft.label)) || '—'],
      ['Marge', (d.margin != null ? d.margin : '—') + ' %'],
      ['Carénages', d.spats ? 'Avec' : 'Sans']
    ];
    const iw = [0.25, 0.23, 0.22, 0.12, 0.18];
    let ix = M;
    info.forEach(([l, v], i) => {
      const cw = W * iw[i];
      label(ix, y, l);
      const ln = wrap(v, 'HB', 10, cw - 10);
      pdf.text(ix, y + 15, ln[0] + (ln.length > 1 ? '…' : ''), { font: 'HB', size: 10 });
      ix += cw;
    });
    y += 27;
    pdf.line(M, y, M + W, y, { color: C.line, lw: 0.6 });
    y += 14;

    // ── Résumé : une carte par calcul
    const cards = [];
    if (d.dep) cards.push({ t: 'Décollage · ' + (d.dep.icao || '—'), big: d.dep.result.required, sub: 'requis / ' + d.dep.result.available + ' ' + d.dep.dist.label, v: d.dep.result.verdict });
    if (d.arr) cards.push({ t: 'Atterrissage · ' + (d.arr.icao || '—'), big: d.arr.result.required, sub: 'requis / ' + d.arr.result.available + ' ' + d.arr.dist.label, v: d.arr.result.verdict });
    if (d.fuel) cards.push({ t: 'Carburant', big: d.fuel.totalL + ' L', sub: 'requis / ' + d.fuel.usable + ' L utilisables', v: d.fuel.ok ? 'ok' : 'bad' });
    if (cards.length) {
      const gap = 10, cw = (W - gap * (cards.length - 1)) / cards.length, ch = 64;
      cards.forEach((c, i) => {
        const x = M + i * (cw + gap);
        const bad = c.v === 'bad';
        pdf.rrect(x, y, cw, ch, 8, { fill: bad ? C.badBg : C.white, stroke: bad ? [0.93, 0.7, 0.68] : C.line, lw: 0.8 });
        label(x + 12, y + 17, wrap(c.t, 'HB', 6.6, cw - 90)[0]);
        pill(pdf, x + cw - 10, y + 8, c.v === 'ok' ? 'OK' : c.v === 'bad' ? 'Insuffisant' : '—', c.v);
        pdf.text(x + 12, y + 42, c.big, { font: 'HB', size: 21, color: bad ? C.badText : C.ink });
        pdf.text(x + 12, y + 55, wrap(c.sub, 'H', 8, cw - 24)[0], { size: 8, color: C.muted });
      });
      y += ch + 18;
    }

    // ── Détail décollage / atterrissage
    function block(x, y0, w, s, kind) {
      let yy = y0;
      const dep = kind === 'dep';
      pdf.rect(x, yy, 3, 14, { fill: C.accent });
      pdf.text(x + 10, yy + 11, (dep ? 'Décollage' : 'Atterrissage') + ' · ' + (s.icao || '—'), { font: 'HB', size: 11.5 });
      if (s.name) pdf.text(x + w, yy + 11, wrap(s.name, 'H', 8, w * 0.42)[0], { size: 8, color: C.muted, align: 'right' });
      yy += 21;
      const row = (l, v) => {
        const lines = wrap(v, 'HB', 8.4, w * 0.6);
        pdf.text(x, yy + 8.5, l, { size: 8.4, color: C.muted });
        lines.forEach((ln, i) => pdf.text(x + w, yy + 8.5 + i * 10, ln, { font: 'HB', size: 8.4, align: 'right' }));
        yy += 5.5 + lines.length * 10;
        pdf.line(x, yy - 1, x + w, yy - 1, { color: C.line, lw: 0.4 });
      };
      const sect = t => { yy += 3; label(x, yy + 7, t); yy += 11; };
      sect('Piste et conditions');
      row('QFU', s.qfu ? s.qfu + '°' : '—');
      row(s.dist.label, s.dist.value ? s.dist.value + ' m' : '—');
      row('Élévation', (s.alt || '—') + ' ft');
      row('Température (OAT)', (s.oat || '—') + ' °C');
      row('Masse', (s.mass || '—') + ' kg');
      row('Vent', s.windText || '—');
      if (s.windSrc) row('Vent retenu', s.windSrc);
      if (s.comps) row('Composantes', s.comps);
      row(dep ? 'Surface' : 'Freinage / état', s.surface || '—');
      if (s.windRule && s.windRule.indexOf('+') >= 0) row('Vent pris en compte', s.windRule);
      sect('Détail du calcul (sans marge)');
      (s.result.rows || []).forEach(([l, v]) => row(l, v));
      if (s.note) {
        yy += 3;
        wrap(s.note, 'H', 7.2, w).forEach(ln => { pdf.text(x, yy + 8, ln, { size: 7.2, color: C.faint }); yy += 9; });
      }
      (s.meteo || []).forEach(m => {
        sect(m.type);
        const lines = wrap(m.raw, 'C', 7, w - 16);
        pdf.rrect(x, yy - 3, w, lines.length * 9 + 10, 5, { fill: C.soft });
        lines.forEach((ln, i) => pdf.text(x + 8, yy + 7 + i * 9, ln, { font: 'C', size: 7, color: [0.25, 0.3, 0.35] }));
        yy += lines.length * 9 + 12;
      });
      return yy;
    }
    const sides = [];
    if (d.dep) sides.push(['dep', d.dep]);
    if (d.arr) sides.push(['arr', d.arr]);
    if (sides.length) {
      ensure(250);
      const gap = 22, colW = sides.length === 2 ? (W - gap) / 2 : W;
      let maxY = y;
      sides.forEach(([k, s], i) => { maxY = Math.max(maxY, block(M + i * (colW + gap), y, colW, s, k)); });
      y = maxY + 12;
    }

    // ── Carburant
    if (d.fuel) {
      const f = d.fuel;
      ensure(110 + (f.phases || []).length * 14);
      pdf.rect(M, y, 3, 14, { fill: C.accent });
      pdf.text(M + 10, y + 11, 'Bilan carburant', { font: 'HB', size: 11.5 });
      pill(pdf, M + W, y, f.ok ? 'Suffisant' : 'Insuffisant', f.ok ? 'ok' : 'bad');
      y += 24;
      const facts = [
        f.onboard ? 'À bord ' + String(f.onboard).replace('.', ',') + ' L' + (f.full ? ' (plein)' : f.usedSince ? ' (plein entamé, ' + f.usedSince + ' de vol)' : '') : null,
        'Utilisable ' + f.usable + ' L',
        'Conso ' + String(f.conso).replace('.', ',') + ' L/h' + (f.spatsPenalty ? ' (+3 % sans carénages)' : ''),
        (f.ok ? 'Reste ' : 'Manque ') + f.remainingL + ' L'
      ].filter(Boolean);
      pdf.text(M, y + 8, facts.join('   ·   '), { size: 8.4, color: C.ink });
      y += 18;
      const xT = M + W * 0.74, xL = M + W;
      label(M, y + 7, 'Poste'); label(xT, y + 7, 'Durée', { align: 'right' }); label(xL, y + 7, 'Litres', { align: 'right' });
      y += 12;
      (f.phases || []).forEach(p => {
        pdf.text(M, y + 8.5, p.ph, { size: 8.6 });
        pdf.text(xT, y + 8.5, p.time, { size: 8.6, color: C.muted, align: 'right' });
        pdf.text(xL, y + 8.5, p.L + ' L', { font: 'HB', size: 8.6, align: 'right' });
        y += 13; pdf.line(M, y - 1, M + W, y - 1, { color: C.line, lw: 0.4 });
      });
      pdf.line(M, y + 1, M + W, y + 1, { color: C.ink, lw: 0.9 });
      pdf.text(M, y + 13, 'Carburant minimum requis', { font: 'HB', size: 9.2 });
      pdf.text(xT, y + 13, f.totalTime, { font: 'HB', size: 9.2, align: 'right' });
      pdf.text(xL, y + 13, f.totalL + ' L', { font: 'HB', size: 9.2, align: 'right' });
      y += 24;
      if (f.depTime) {
        pdf.text(M, y + 8, 'Mise en route ' + f.depTime + '   ·   atterrissage max (réserve conservée) ' + f.maxLdg +
          '   ·   arrêt moteur (panne sèche) ' + f.engineStop + '   —   heure locale', { size: 8.2, color: C.muted });
        y += 16;
      }
      y += 8;
    }

    // ── Nuit aéronautique
    if (d.sun && d.sun.sunset) {
      ensure(30);
      pdf.rrect(M, y, W, 24, 6, { fill: C.amberBg });
      pdf.text(M + 12, y + 15.5, 'Coucher du soleil ' + d.sun.sunset + '   ·   Nuit aéronautique ' + d.sun.night +
        (d.sun.icao ? '  (' + d.sun.icao + ')' : '') + '   —   heure locale, date du jour', { font: 'HB', size: 8.6, color: C.amber });
      y += 32;
    }

    function footer() {
      const fy = pdf.H - 50;
      pdf.line(M, fy, M + W, fy, { color: C.line, lw: 0.6 });
      pdf.text(M, fy + 13, 'Calcul préparatoire au vol : ne remplace pas le manuel de vol. Le commandant de bord reste seul responsable de ses décisions.',
        { size: 7, color: C.muted });
      pdf.text(M, fy + 24, 'Fiche n° ' + d.id + ' · établie le ' + fmtLocal(d.created) + ' · Performances ' + (d.app || ''), { size: 7, color: C.muted });
      if (d.hash) pdf.text(M, fy + 34, 'Empreinte SHA-256 : ' + d.hash, { font: 'C', size: 6.3, color: C.faint });
    }
    footer();
    return pdf.build({ title: 'Fiche ' + d.id });
  }

  /* Empreinte d'une fiche : SHA-256 du JSON canonique, sans le champ hash */
  function ficheHash(d) {
    const c = Object.assign({}, d); delete c.hash;
    return sha256Hex(canon(c));
  }

  global.FichePDF = { renderFichePDF, ficheHash, sha256Hex, canon, fmtLocal };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const F = window.FichePDF;
  const KEY = 'acbt-archives-pw';
  let pw = '';
  try { pw = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  let list = [];

  async function api(params, method) {
    const r = await fetch('/api/fiches' + (params ? '?' + new URLSearchParams(params) : ''), {
      method: method || 'GET', headers: { Authorization: 'Bearer ' + pw }, cache: 'no-store'
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!j) throw new Error('Les archives ne répondent pas pour le moment.');
    if (!r.ok || !j.ok) { const err = new Error(j.error || ('Erreur ' + r.status)); err.status = r.status; throw err; }
    return j;
  }

  const fmt = iso => F.fmtLocal(iso);
  const p2 = n => String(n).padStart(2, '0');
  const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  function dayLabel(d) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    const diff = Math.round((t - x) / 86400000);
    const base = JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + (d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : '');
    if (diff === 0) return 'Aujourd\'hui · ' + base;
    if (diff === 1) return 'Hier · ' + base;
    return cap(base);
  }
  const hhmm = d => p2(d.getHours()) + 'h' + p2(d.getMinutes());
  const vchip = (l, v) => '<span class="v' + (v === 'bad' ? ' bad' : v ? '' : ' none') + '">' + l + '</span>';

  function render(q, total) {
    const avions = new Set(list.map(f => f.aircraft).filter(Boolean)).size;
    $('bandV').innerHTML = total + '<small>fiche' + (total > 1 ? 's' : '') + (avions ? ' · ' + avions + ' avion' + (avions > 1 ? 's' : '') : '') + '</small>';
    $('count').textContent = q ? list.length + ' résultat' + (list.length > 1 ? 's' : '') + ' sur ' + total : '';
    if (!list.length) { $('rows').innerHTML = '<div class="empty">Aucune fiche' + (q ? ' pour cette recherche' : ' pour le moment') + '.</div>'; return; }
    let h = '', cur = null;
    list.forEach(f => {
      const d = new Date(f.created_at), k = d.toDateString();
      if (k !== cur) { if (cur) h += '</div>'; cur = k; h += '<div class="dayh">' + esc(dayLabel(d)) + '</div><div class="tl">'; }
      const bad = [f.dep_verdict, f.arr_verdict, f.fuel_verdict].includes('bad');
      const route = (f.dep_icao || '—') + ' → ' + (f.arr_icao || '—');
      h += '<button type="button" class="it' + (bad ? ' bad' : '') + '" data-id="' + esc(f.id) + '">' +
        '<div class="h">' + esc(f.pilot || 'Pilote non indiqué') + '<span>' + hhmm(d) + '</span></div>' +
        '<div class="s">' + esc(f.aircraft || '') + ' · ' + esc(route) + '</div>' +
        '<div class="vs">' + vchip('DÉP', f.dep_verdict) + vchip('ARR', f.arr_verdict) + vchip('CARB', f.fuel_verdict) + '</div></button>';
    });
    $('rows').innerHTML = h + '</div>';
  }

  async function load(q) {
    const j = await api(q ? { q } : { limit: 500 });
    list = j.fiches;
    render(q, j.total);
  }

  function closeSheet() { $('detail').hidden = true; $('sheetBg').hidden = true; document.querySelectorAll('.it.sel').forEach(b => b.classList.remove('sel')); }
  async function show(id) {
    document.querySelectorAll('.it').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
    $('sheetBg').hidden = false; $('detail').hidden = false;
    $('detail').innerHTML = '<div class="empty">Chargement…</div>';
    const { fiche } = await api({ id });
    const d = fiche.data;
    const ok = v => v ? '<span class="v">OK</span>' : '<span class="v bad">INSUFFISANT</span>';
    const side = (lbl, s) => !s ? '' : `<div class="blk"><div class="bt">${lbl} · ${esc(s.icao)}${ok(s.result.verdict !== 'bad')}</div>
      <div class="g2"><div><small>Requis</small><b>${esc(s.result.required)}</b></div><div><small>Disponible</small><b>${esc(s.result.available)}</b></div></div>
      <div class="row" style="margin-top:8px"><span>Piste · masse</span><span>${esc(s.qfu)} · ${esc(s.mass)} kg</span></div>
      <div class="row"><span>Vent</span><span>${esc(s.windText)}</span></div></div>`;
    const fuel = d.fuel ? `<div class="blk"><div class="bt">Carburant${ok(d.fuel.ok)}</div>
      <div class="g2"><div><small>Requis</small><b>${esc(d.fuel.totalL)} L</b></div><div><small>Utilisable</small><b>${esc(d.fuel.usable)} L</b></div></div></div>` : '';
    const dt = new Date(fiche.created_at);
    $('detail').innerHTML = `<div class="sh-top"><div><div class="k">Fiche ${esc(fiche.id)}</div>
        <div class="t">${esc(d.pilot)}</div><div class="s">${esc(d.aircraft.label || d.aircraft.immat)} · ${esc(dayLabel(dt))} · ${hhmm(dt)}</div></div>
        <button class="sh-x" id="shX" type="button" aria-label="Fermer">×</button></div>
      <div class="sh-in">${side('Décollage', d.dep)}${side('Atterrissage', d.arr)}${fuel}
        <div class="blk"><div class="bt">Fiche</div>
          <div class="row"><span>Calculée le</span><span>${esc(fmt(fiche.created_at))}</span></div>
          <div class="row"><span>Reçue au club le</span><span>${esc(fmt(fiche.received_at))}</span></div>
          <div style="margin-top:10px">${fiche.hash_ok ? '<span class="badge ok">✓ Empreinte vérifiée : fiche non modifiée</span>' : '<span class="badge bad">Empreinte non conforme</span>'}</div>
          <div class="hash">SHA-256 ${esc(fiche.hash)}</div></div>
        <div class="acts"><button class="btn pri" id="dl" type="button">Télécharger le PDF</button>
        <button class="btn danger" id="del" type="button">Supprimer la fiche</button></div></div>`;
    $('shX').onclick = closeSheet;
    $('del').onclick = async () => {
      if (!confirm('Supprimer définitivement la fiche ' + fiche.id + ' des archives du club ?\n\nCette action ne peut pas être annulée.')) return;
      try { await api({ id: fiche.id }, 'DELETE'); closeSheet(); await load($('q').value.trim()); }
      catch (err) { alert(err.message); }
    };
    $('dl').onclick = () => {
      const blob = new Blob([F.renderFichePDF(d)], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Fiche_' + d.aircraft.immat + '_' + fiche.id + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 15000);
    };
  }

  function exportCsv() {
    const head = ['Fiche', 'Calculée le', 'Reçue le', 'Pilote', 'Avion', 'Départ', 'Verdict décollage', 'Arrivée', 'Verdict atterrissage', 'Verdict carburant', 'Empreinte vérifiée'];
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(';')].concat(list.map(f => [f.id, fmt(f.created_at), fmt(f.received_at), f.pilot, f.aircraft,
      f.dep_icao, f.dep_verdict, f.arr_icao, f.arr_verdict, f.fuel_verdict, f.hash_ok ? 'oui' : 'non'].map(q).join(';')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'archives_perfs_acbt.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  async function enter() {
    try {
      await load('');
      $('loginCard').hidden = true; $('app').hidden = false; $('logout').hidden = false; $('band').hidden = false;
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    } catch (e) {
      $('loginCard').hidden = false; $('app').hidden = true; $('band').hidden = true;
      $('loginMsg').textContent = e.status === 401 || e.status === 403 ? 'Mot de passe incorrect.' : e.message;
      try { sessionStorage.removeItem(KEY); } catch (_) {}
    }
  }

  $('loginForm').addEventListener('submit', e => { e.preventDefault(); pw = $('pw').value.trim(); $('loginMsg').textContent = ''; enter(); });
  $('logout').addEventListener('click', () => { try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); });
  let t = null;
  $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => load($('q').value.trim()).catch(err => alert(err.message)), 300); });
  $('rows').addEventListener('click', e => { const b = e.target.closest('.it[data-id]'); if (b) show(b.dataset.id).catch(err => { $('detail').innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; }); });
  $('sheetBg').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  $('csv').addEventListener('click', exportCsv);
  if (pw) enter();
})();
</script>
</body>
</html>
